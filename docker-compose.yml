version: '3.8'

services:
  # Interactive Web Dashboard (Streamlit)
  web:
    build: .
    container_name: drowsiness-detector-web
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
