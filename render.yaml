services:
  # Streamlit Web App Deployment on Render
  - type: web
    name: drowsiness-detection-web
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
    plan: free
